<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1b33"><title>Realty25AZ Move-out Runner</title><style>
:root{
  --navy:#0b1b33;
  --navy2:#132744;
  --gold:#c9983a;
  --gold2:#b98527;
  --gold-soft:#fff4cf;
  --cream:#fbfaf6;
  --white:#ffffff;
  --ink:#0c1730;
  --muted:#5d6675;
  --line:#d8dde6;
  --soft:#eef1f5;
  --soft2:#f5f6f8;
  --danger:#995a00;
  --shadow:0 8px 24px rgba(10,27,51,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
.app{min-height:100vh;background:var(--cream)}
.header{
  background:linear-gradient(90deg,var(--navy),var(--navy2));
  color:#fff;
  padding:calc(env(safe-area-inset-top) + 20px) 28px 22px;
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:24px;
  align-items:center;
}
.brand{
  font-size:46px;
  font-weight:900;
  letter-spacing:-.035em;
  line-height:1;
}
.brand .gold{color:var(--gold)}
.tagline{font-size:18px;letter-spacing:.04em;margin-top:9px;font-weight:700}
.titleBlock{border-left:1px solid rgba(255,255,255,.18);padding-left:34px}
.title{font-size:30px;font-weight:900}
.property{font-size:20px;margin-top:4px}
.address{font-size:15px;margin-top:3px;opacity:.92}
.menu{
  width:48px;height:42px;border:0;background:transparent;padding:0;display:grid;gap:7px;align-content:center
}
.menu span{height:4px;background:#fff;border-radius:999px;display:block}

.main{max-width:1080px;margin:0 auto;padding:22px 28px 40px}
.progressRow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px}
.stepCount,.pct{font-size:34px;font-weight:900}
.progress{
  height:24px;background:#e4e7eb;border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)
}
.progressFill{
  height:100%;
  background:linear-gradient(90deg,var(--gold2),var(--gold));
  width:0%;
  border-radius:999px;
  transition:width .2s ease;
}
.breadcrumb{text-align:center;font-size:22px;color:#30394a;margin:8px 0 22px}
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:26px;
  padding:28px 32px;
  box-shadow:var(--shadow);
}
.section{
  color:#99630d;
  font-weight:900;
  font-size:24px;
  letter-spacing:.015em;
  text-transform:uppercase;
}
.task{
  font-size:54px;
  line-height:1.04;
  margin:12px 0 18px;
  font-weight:950;
  letter-spacing:-.035em;
}
.instruction{
  font-size:21px;
  line-height:1.45;
  color:var(--muted);
  font-weight:650;
  margin-bottom:18px;
}
.checkLead{font-size:24px;color:var(--muted);margin:8px 0 10px}
.checks{display:grid;gap:13px;margin-top:10px}
.check{
  display:flex;align-items:flex-start;gap:16px;font-size:25px;line-height:1.25;cursor:pointer
}
.check input{
  appearance:none;
  width:38px;height:38px;min-width:38px;
  border:3px solid #98a1af;border-radius:8px;margin:0;
  background:#fff;position:relative;
}
.check input:checked{
  background:var(--gold);border-color:var(--gold);
}
.check input:checked:after{
  content:"";
  position:absolute;
  left:10px;top:4px;
  width:9px;height:18px;
  border:solid #fff;border-width:0 4px 4px 0;
  transform:rotate(45deg);
}
.issuePanel{
  margin-top:22px;
  background:linear-gradient(135deg,#fff7da,#fff2bf);
  border:1px solid #f0d58f;
  border-radius:24px;
  padding:22px 28px 26px;
  box-shadow:var(--shadow);
}
.issueTop{
  display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap
}
.issueLabel{
  display:flex;align-items:center;gap:14px;
  font-size:34px;font-weight:950;color:#8b4d00
}
.warnIcon{
  width:42px;height:42px;border:4px solid #8b4d00;border-radius:9px;
  transform:rotate(45deg);position:relative;display:inline-block
}
.warnIcon:after{
  content:"!";
  position:absolute;transform:rotate(-45deg);
  left:12px;top:1px;font-size:25px;font-weight:900
}
.toggle{
  background:#fff;border:1px solid #c7ccd4;border-radius:999px;padding:3px;
  display:grid;grid-template-columns:1fr 1fr;min-width:310px
}
.toggle button{
  border:0;background:transparent;border-radius:999px;padding:13px 18px;
  font-size:18px;font-weight:800;color:#697282
}
.toggle button.active{
  background:linear-gradient(90deg,var(--gold2),var(--gold));
  color:#fff;
}
.issueHint{font-size:21px;color:#505969;margin:16px 0 10px}
.noteWrap{position:relative}
textarea{
  width:100%;min-height:126px;resize:vertical;
  border:1px solid #cfd4dc;border-radius:16px;background:#fff;
  padding:18px 64px 18px 18px;font-size:22px;color:var(--ink);outline:none
}
textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,152,58,.15)}
.mic{
  position:absolute;right:14px;bottom:15px;width:44px;height:44px;
  border:0;background:transparent;font-size:30px;color:#6b7280
}
.mic.listening{color:#9b5b00;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

.photoRow{
  display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px
}
.photoBtn{
  border:1px solid var(--line);border-radius:24px;background:linear-gradient(#f4f5f7,#eceff3);
  color:var(--ink);padding:28px 24px;min-height:126px;
  font-size:30px;font-weight:950;box-shadow:var(--shadow)
}
.photoBtn small{display:block;font-size:17px;font-weight:650;color:var(--muted);margin-top:10px}
.photoBtn:active{transform:scale(.995)}

.navRow{
  display:grid;grid-template-columns:1.05fr .75fr 1.1fr;gap:18px;margin-top:24px
}
.navBtn{
  border:0;border-radius:24px;padding:27px 18px;min-height:108px;
  font-size:30px;font-weight:950;box-shadow:var(--shadow)
}
.back,.skip{background:linear-gradient(#f4f5f7,#e9edf2);color:var(--ink)}
.next{
  background:linear-gradient(90deg,var(--gold2),var(--gold));
  color:#fff
}
.next:active,.back:active,.skip:active{transform:scale(.995)}
.arrow{font-size:44px;vertical-align:-4px}
.footer{
  display:flex;justify-content:space-between;gap:14px;
  margin-top:14px;color:var(--muted);font-size:15px
}
.done{
  display:none;
  max-width:900px;margin:38px auto;padding:0 28px 60px
}
.doneCard{
  background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow)
}
.doneTitle{font-size:44px;font-weight:950;margin-bottom:10px}
.log{
  white-space:pre-wrap;background:#f7f8fa;border:1px solid var(--line);
  border-radius:16px;padding:16px;margin-top:18px;
  max-height:340px;overflow:auto;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace
}
.doneBtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.doneBtns button{border:0;border-radius:18px;padding:20px;font-size:20px;font-weight:900}
.goldBtn{background:var(--gold);color:#fff}
.grayBtn{background:#e9edf2;color:var(--ink)}


.menuBackdrop{
  position:fixed;inset:0;background:rgba(5,15,30,.38);z-index:30;display:none
}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(420px,88vw);
  background:#fff;z-index:31;transform:translateX(105%);
  transition:transform .18s ease;box-shadow:-18px 0 40px rgba(0,0,0,.18);
  padding:calc(env(safe-area-inset-top) + 24px) 22px 24px;
}
.drawer.open{transform:translateX(0)}
.drawerTitle{font-size:28px;font-weight:950;margin:6px 0 22px}
.drawerBtn{
  width:100%;border:1px solid var(--line);background:#f7f8fa;color:var(--ink);
  border-radius:18px;padding:18px;text-align:left;font-size:20px;font-weight:850;
  margin-bottom:12px
}
.drawerBtn.gold{background:linear-gradient(90deg,var(--gold2),var(--gold));color:#fff;border:0}
.drawerClose{
  position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 18px);
  width:44px;height:44px;border:0;border-radius:999px;background:#eef1f5;
  font-size:26px;font-weight:900
}
.modalWrap{
  position:fixed;inset:0;background:rgba(5,15,30,.48);z-index:40;
  display:none;align-items:center;justify-content:center;padding:20px
}
.modal{
  width:min(720px,96vw);max-height:88vh;overflow:auto;
  background:#fff;border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.28)
}
.modal h2{margin:0 0 18px;font-size:30px}
.field{margin-bottom:16px}
.field label{display:block;font-size:15px;font-weight:850;color:var(--muted);margin-bottom:7px}
.field input{
  width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 15px;font-size:20px
}
.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.modalActions button{border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:900}
.previewBox{
  white-space:pre-wrap;background:#f7f8fa;border:1px solid var(--line);
  border-radius:14px;padding:14px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  max-height:55vh;overflow:auto
}

@media(max-width:760px){
  .header{grid-template-columns:1fr auto;padding-left:18px;padding-right:18px}
  .titleBlock{grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid rgba(255,255,255,.14);padding-top:14px}
  .brand{font-size:36px}
  .tagline{font-size:15px}
  .main{padding:18px 14px 28px}
  .stepCount,.pct{font-size:28px}
  .progress{height:18px}
  .breadcrumb{font-size:18px}
  .card{padding:22px 20px}
  .section{font-size:20px}
  .task{font-size:42px}
  .instruction{font-size:19px}
  .checkLead{font-size:20px}
  .check{font-size:21px}
  .check input{width:32px;height:32px;min-width:32px}
  .issueLabel{font-size:29px}
  .toggle{min-width:0;width:100%}
  textarea{font-size:19px}
  .photoBtn{font-size:25px;padding:22px 14px}
  .photoBtn small{font-size:14px}
  .navBtn{font-size:24px;min-height:92px}
}

/* Phone-first refinements while preserving the iPad layout */
@media(max-width:600px){
  body{padding-bottom:108px}
  .header{
    grid-template-columns:1fr auto;
    gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  }
  .brand{font-size:30px}
  .tagline{font-size:10px;letter-spacing:.06em;margin-top:5px}
  .menu{width:42px;height:38px}

  .titleBlock{
    grid-column:1/-1;
    padding-top:10px;
    margin-top:2px;
  }
  .title{font-size:18px}
  .property{font-size:16px;margin-top:2px}
  .address{font-size:12px;line-height:1.25}

  .main{padding:12px 10px 20px}
  .progressRow{gap:10px}
  .stepCount,.pct{font-size:20px}
  .progress{height:13px}
  .breadcrumb{
    margin:6px 0 12px;

    line-height:1.25;
  }

  .card{
    border-radius:18px;
    padding:18px 16px;
  }
  .section{font-size:15px}
  .task{
    font-size:34px;
    line-height:1.02;
    margin:8px 0 12px;
  }
  .instruction{
    font-size:17px;
    line-height:1.35;
    margin-bottom:14px;
  }
  .checkLead{font-size:16px;margin-bottom:8px}
  .checks{gap:10px}
  .check{
    font-size:17px;
    gap:12px;
    line-height:1.2;
  }
  .check input{
    width:28px;height:28px;min-width:28px;

  }
  .check input:checked:after{
    left:8px;top:3px;width:7px;height:14px;
    border-width:0 3px 3px 0;
  }

  .issuePanel{
    margin-top:12px;
    border-radius:18px;
    padding:16px;
  }
  .issueLabel{font-size:23px}
  .warnIcon{width:31px;height:31px;border-width:3px}
  .warnIcon:after{left:9px;top:0;font-size:19px}
  .issueHint{font-size:16px;margin:10px 0 8px}
  textarea{
    min-height:92px;
    border-radius:13px;
    padding:13px 52px 13px 13px;
    font-size:17px;
  }
  .mic{
    right:9px;bottom:9px;
    width:40px;height:40px;
    font-size:25px;
  }

  .photoRow{
    gap:10px;
    margin-top:12px;
  }
  .photoBtn{
    min-height:84px;
    border-radius:18px;
    padding:16px 10px;
    font-size:19px;
  }
  .photoBtn small{
    font-size:11px;
    line-height:1.15;
    margin-top:6px;
  }

  .navRow{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:20;
    grid-template-columns:1fr .8fr 1.1fr;
    gap:8px;
    margin:0;
    padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    background:rgba(251,250,246,.96);
    backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    box-shadow:0 -8px 24px rgba(10,27,51,.08);
  }
  .navBtn{
    min-height:68px;
    border-radius:16px;
    padding:14px 8px;
    font-size:18px;
    box-shadow:none;
  }
  .arrow{font-size:27px;vertical-align:-2px}
  .footer{
    font-size:11px;
    margin-top:8px;
    padding-bottom:8px;
    flex-direction:column;
    gap:2px;
  }

  .drawer{
    width:92vw;
    padding-left:16px;
    padding-right:16px;
  }
  .drawerTitle{font-size:24px}
  .drawerBtn{font-size:18px;padding:16px}
  .modalWrap{padding:10px}
  .modal{
    width:100%;
    max-height:92vh;
    border-radius:18px;
    padding:18px 14px;
  }
  .modal h2{font-size:25px}
  .field input{font-size:17px}
  .modalActions{grid-template-columns:1fr}
  .done{
    padding:0 10px 120px;
  }
  .doneCard{
    border-radius:20px;
    padding:20px 16px;
  }
  .doneTitle{font-size:32px}
  .doneBtns{grid-template-columns:1fr}
}


.field select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:14px}.statuses{display:flex;flex-wrap:wrap;gap:8px}.statuses button{border:1px solid var(--line);border-radius:14px;padding:12px;background:white;font-weight:800}.statuses .active{background:var(--gold);color:white}.checks{font-size:21px;line-height:1.5}.compact{min-height:60px;padding:12px;font-size:22px}.field button{padding:12px;border:0;border-radius:12px;font-weight:800}.issuePanel textarea{min-height:80px}.task{font-size:42px}</style></head><body><header class="header"><div><div class="brand">Realty<span class="gold">25</span>AZ</div><div class="tagline">PROPERTY MANAGEMENT &amp; BROKERAGE</div></div><div class="titleBlock"><div class="title">Move-out Walkthrough</div><div class="address" id="addr"></div></div><button class="menu" aria-label="Menu" onclick="menu()"><span></span><span></span><span></span></button></header><main class="main" id="app"></main><script>
const K='r25moveout2';let s;try{s=JSON.parse(localStorage.getItem(K))}catch(e){}const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};s=s||{meta:{address:'',sr:'',date:today(),rooms:3,baths:2},steps:[],i:0};const a=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){alert('Local save failed. Export backup.')}}function m(k,v){s.meta[k]=v;save()}function setup(){a.innerHTML='<section class="card"><h1 class="task">Subject property</h1><div class="field"><label>Address</label><input id="address" value="'+esc(s.meta.address)+'" oninput="m(\'address\',this.value)"><button class="grayBtn" onclick="gps()">Use GPS / find address</button><small id="gpsmsg"></small></div>'+[['sr','SR','text'],['date','Date','date'],['rooms','Rooms (bedrooms, den, office)','number'],['baths','Bathrooms','number']].map(([k,l,t])=>'<div class="field"><label>'+l+'</label><input type="'+t+'" min="0" max="20" value="'+esc(s.meta[k])+'" onchange="m(\''+k+'\',this.value)"></div>').join('')+'<button class="navBtn next compact" onclick="start()">START</button></section>'}
function gps(){if(!navigator.geolocation)return alert('GPS unavailable');document.getElementById('gpsmsg').textContent='Finding location…';navigator.geolocation.getCurrentPosition(p=>{let lat=p.coords.latitude,lon=p.coords.longitude;s.meta.gps={lat,lon,accuracy:p.coords.accuracy};save();let box=document.getElementById('gpsmsg');box.textContent='Location found. ';let link=document.createElement('a');link.href='https://maps.apple.com/?ll='+lat+','+lon+'&q='+lat+','+lon;link.target='_blank';link.rel='noopener';link.textContent='Open Maps to confirm address';box.appendChild(link)},()=>{document.getElementById('gpsmsg').textContent='GPS unavailable. Enter address manually.'},{enableHighAccuracy:true,timeout:12000})}
function start(){if(!s.meta.address.trim()||!s.meta.date||!s.meta.sr.trim())return alert('Enter address, date and SR');let r=Number(s.meta.rooms),b=Number(s.meta.baths);if(!Number.isInteger(r)||!Number.isInteger(b)||r<0||b<0||r>20||b>20)return alert('Check room counts');let list=[['Front exterior','Elevation, driveway, walkways, landscaping, exterior paint and lights'],['Backyard','Landscaping, pet waste, patio, fences, gates, irrigation, pool if present'],['Entry / living','Doors, locks, walls, ceilings, floors, trim, windows, blinds, lights, cleanliness'],['Kitchen','Cabinets inside and out, counters, sink and under-sink plumbing, appliances inside and out, pantry, cleanliness']];for(let i=1;i<=r;i++)list.push(['Room '+i,'Walls, ceilings, floors, trim, windows, blinds, closets, doors, lights, cleanliness']);for(let i=1;i<=b;i++)list.push(['Bathroom '+i,'Vanity, sink, plumbing, toilet, tub/shower, grout, caulk, exhaust, mirror, GFCI, cleanliness']);list.push(['Laundry','Washer, dryer, lint trap, hookups, vent, cabinets, floor'],['Garage','Door, opener, remotes, walls, floor, lights, storage'],['Systems & safety','Utility availability, HVAC filter, thermostat, water heater, smoke/CO alarms, panel exterior, visible plumbing, equipment labels'],['Move-out / departure','Belongings, trash, keys, mailbox, remotes, original appliances, secure property, access reset if authorized']);s.steps=list.map(([area,checks])=>({area,checks,status:'OK',note:'',photos:0,visited:false}));save();render()}
function u(k,v){s.steps[s.i][k]=v;save()}function move(d){s.i=Math.max(0,Math.min(s.steps.length-1,s.i+d));save();render()}function render(){document.getElementById('addr').textContent=s.meta.address;if(!s.steps.length)return setup();let t=s.steps[s.i],n=s.steps.length,p=Math.round(s.steps.filter(x=>x.visited).length/n*100);a.innerHTML='<div class="progressRow"><div class="stepCount">'+(s.i+1)+' / '+n+'</div><div class="progress"><div class="progressFill" style="width:'+p+'%"></div></div><div class="pct">'+p+'%</div></div><section class="card"><div class="section">Move-out</div><h1 class="task">'+esc(t.area)+'</h1><div class="instruction">Capture overview and details. Check:</div><div class="checks">'+esc(t.checks)+'</div></section><section class="issuePanel"><div class="statuses">'+['OK','Attention','Not applicable','Not verified'].map(v=>'<button class="'+(t.status===v?'active':'')+'" onclick="u(\'status\',\''+v+'\');render()">'+v+'</button>').join('')+'</div><div class="issueHint">Dictate or type exceptions only. Note specific unchecked items.</div><textarea placeholder="Optional notes" oninput="u(\'note\',this.value)">'+esc(t.note)+'</textarea></section><div class="photoRow"><button class="photoBtn compact" onclick="u(\'photos\','+(t.photos+1)+');render()">📷 + PHOTO ('+t.photos+')</button><button class="photoBtn compact" onclick="u(\'photos\',Math.max(0,'+t.photos+'-1));render()">− PHOTO</button></div><div class="navRow"><button class="navBtn back" onclick="move(-1)">‹ BACK</button><button class="navBtn skip" onclick="skip()">SKIP</button><button class="navBtn next" onclick="next()">NEXT ›</button></div><div class="footer">Photos logged: '+s.steps.reduce((n,x)=>n+x.photos,0)+' | Saved locally</div>'}
function next(){let t=s.steps[s.i];if(['Attention','Not verified'].includes(t.status)&&!t.note.trim())return alert('Add a brief exception note');t.visited=true;save();if(s.i===s.steps.length-1)review();else move(1)}function skip(){u('status','Not verified');if(!s.steps[s.i].note)u('note','Skipped');next()}function menu(){if(!s.steps.length)return setup();review()}function review(){let missing=s.steps.filter(x=>!x.visited);a.innerHTML='<section class="card"><h1 class="task">Review / export</h1><p>'+missing.length+' unvisited areas. '+s.steps.reduce((n,x)=>n+x.photos,0)+' photos logged.</p><button class="navBtn next compact" onclick="exp()">EXPORT JSON</button> <button class="navBtn back compact" onclick="render()">RESUME</button><p><button class="grayBtn compact" onclick="reset()">New visit</button></p>'+s.steps.map((t,i)=>'<p><button class="grayBtn compact" onclick="s.i='+i+';save();render()">'+esc(t.area)+' · '+(t.visited?esc(t.status):'Unvisited')+'</button></p>').join('')+'</section>'}function exp(){let l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify({schema:'r25.moveout.v2',...s},null,2)],{type:'application/json'}));l.download='R25_MoveOut_'+s.meta.sr.replace(/[^a-z0-9_-]/gi,'_')+'.json';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},30000)}function reset(){if(confirm('Export verified? Clear this visit?')){localStorage.removeItem(K);location.reload()}}render();</script></body></html>
