const K='r25moveout1';let s;try{s=JSON.parse(localStorage.getItem(K))}catch(e){}s=s||{meta:{},steps:[],i:0};const a=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){alert('Local storage unavailable. Export backup.')}}function m(k,v){s.meta[k]=v;save()}function setup(){a.innerHTML='<section>'+['Address','SR','Date','Bedrooms','Bathrooms','Extra rooms (comma separated)','Authorization','Possession'].map(k=>'<label>'+k+'<input value="'+esc(s.meta[k])+'" onchange="m('+esc(JSON.stringify(k))+',this.value)"></label>').join('')+['Electricity','Water','Gas'].map(k=>'<label>'+k+'<select onchange="m('+esc(JSON.stringify(k))+',this.value)">'+['Unknown','On','Off','Not applicable'].map(v=>'<option '+(s.meta[k]===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'<button onclick="start()">Start</button></section>'}function start(){if(!['Address','SR','Date','Bedrooms','Bathrooms','Authorization','Possession'].every(k=>String(s.meta[k]??'').trim()))return alert('Complete setup first');for(let [g,items] of Object.entries(G)){let names=[g];if(g==='Bedroom'||g==='Bathroom'){let n=Number(s.meta[g+'s']);if(!Number.isInteger(n)||n<0||n>20){s.steps=[];return alert('Invalid room count')}names=Array.from({length:n},(_,i)=>g+' '+(i+1));if(g==='Bedroom')names.push(...(s.meta['Extra rooms (comma separated)']||'').split(',').map(x=>x.trim()).filter(Boolean))}for(let area of names)for(let item of items.split('|'))s.steps.push({area,item,status:'',operation:'Not checked',note:'',photos:0,classification:''})}save();render()}function u(k,v){s.steps[s.i][k]=v;save()}function move(d){s.i=Math.max(0,Math.min(s.steps.length-1,s.i+d));save();render()}function render(){if(!s.steps.length)return setup();let t=s.steps[s.i];a.innerHTML='<p>'+(s.i+1)+' / '+s.steps.length+'</p><section><h2>'+esc(t.area)+'</h2><h3>'+e RL.createObjectURL(new Blob([JSON.stringify({schema:'r25.moveout.v1',...s},null,2)],{type:'application/json'}));l.download='R25_MoveOut.json';document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},30000)}function reset(){if(confirm('Export verified? Permanently clear local visit?')){localStorage.removeItem(K);location.reload()}}render();</script></body></html>
